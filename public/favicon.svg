<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chinoz kutubxonasi">
  <!-- Logotipdan olingan uch element: siyoh zamin, tilla nur, peshtoq ravoq va ochilgan kitob.
       Vaqtinchalik belgi: to'liq logotipning vektor (SVG) nusxasi dizaynerdan olinishi kerak. -->
  <rect width="64" height="64" rx="13" fill="#0E1E3A"/>

  <!-- Nur — ravoq tepasidan -->
  <g stroke="#C8A24A" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <path d="M32 10 V5"/>
    <path d="M22 13 L19.5 8.5"/>
    <path d="M42 13 L44.5 8.5"/>
  </g>

  <!-- Peshtoq — ravoq -->
  <path d="M18 43 L18 27 Q18 16.5 32 12 Q46 16.5 46 27 L46 43 Z"
        fill="none" stroke="#C8A24A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Ochilgan kitob -->
  <path d="M12 44 Q22 39.5 32 44 Q42 39.5 52 44 L52 50 Q42 45.5 32 50 Q22 45.5 12 50 Z"
        fill="#F6F1E6"/>
  <path d="M32 44 V50" stroke="#0E1E3A" stroke-width="1.6"/>
</svg>
