<!doctype html>
<!-- lang atributi i18n bilan sinxronlanadi (src/I18n/index.js) -->
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <title>Chinoz axborot-kutubxona markazi</title>
  <meta name="description"
    content="Chinoz axborot-kutubxona markazining rasmiy veb-sayti: kitoblar katalogi, yangiliklar, tadbirlar, hujjatlar va kutubxona xizmatlari." />

  <!-- Brauzer manzil paneli rangi — ikkala mavzu uchun -->
  <meta name="theme-color" content="#F6F1E6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#081227" media="(prefers-color-scheme: dark)" />

  <!--
    PESHTOQ shriftlari — Spectral (sarlavha va uzoq o'qish),
    IBM Plex Sans (interfeys), IBM Plex Mono (raqam va metadata).

    Uchtasi ham kirill subsetiga ega. Bu shart edi: oldingi shrift
    (Plus Jakarta Sans) da kirill yo'q, shuning uchun ru va cyrl
    tillarida butun sayt tizim shriftiga tushib ketardi.

    Kirill fayllari o'z-o'zidan tejamli yuklanadi: Google Fonts har
    subset uchun `unicode-range` beradi, ya'ni brauzer kirill woff2
    faylini faqat sahifada kirill harf chizilganda so'raydi.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

  <script>
    /* Mavzuni React dan OLDIN qo'yadi.
       Aks holda birinchi kadrda yorug' rejim ko'rinib, keyin to'qqa
       o'tadi ("mavzu miltillashi"). Qiymatlar: light | dark | system. */
    (function () {
      try {
        var t = localStorage.getItem('peshtoq-theme');
        if (t === 'dark' || t === 'light' || t === 'system') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* maxfiy oyna — yorug' rejimda qolamiz */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
